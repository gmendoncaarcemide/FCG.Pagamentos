apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-pagamentos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fcg-pagamentos
  template:
    metadata:
      labels:
        app: fcg-pagamentos
    spec:
      # Configuração DNS para resolver hostnames externos (como CloudAMQP)
      dnsPolicy: "None"
      dnsConfig:
        nameservers:
          - "8.8.8.8"
          - "8.8.4.4"
        searches:
          - "default.svc.cluster.local"
          - "svc.cluster.local"
          - "cluster.local"
      containers:
      - name: fcg-jogos
        image: fabriciorosanet/fcg-pagamentos-api:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        args:
          - "--ASPNETCORE_ENVIRONMENT=Production"
          - "--RabbitMQ__HostName=toucan.lmq.cloudamqp.com"
          - "--RabbitMQ__Port=5671"
          - "--RabbitMQ__UserName=evqzezjc"
          - "--RabbitMQ__Password=k9IXTGOnuZ3i_5eVKkiS9iWa32Ibf0j4"
          - "--RabbitMQ__VirtualHost=evqzezjc"
          - "--RabbitMQ__UseSsl=true"
          - "--RabbitMQ__SslServerName=toucan.lmq.cloudamqp.com"
        livenessProbe:
          httpGet:
            path: /swagger/index.html
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /swagger/index.html
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5